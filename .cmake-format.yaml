parse:
  additional_commands:
    add_cpp_test:
      kwargs:
        DEPS: "*"
        FILES: "*"
        ASSET_DIR: 1
    add_cpp_benchmark:
      kwargs:
        DEPS: "*"
        INCLUDE_DIRS: "*"
        ASSET_DIR: 1

format:
  line_width: 120
  tab_size: 4
  use_tabchars: false
  fractional_tab_policy: use-space

  # Prefer one compact line for genuinely small calls, but expand structured target declarations.
  max_subgroups_hwrap: 2
  max_pargs_hwrap: 6
  max_rows_cmdline: 2
  max_lines_hwrap: 2
  min_prefix_chars: 4
  max_prefix_chars: 10

  separate_ctrl_name_with_space: false
  separate_fn_name_with_space: false
  dangle_parens: true
  dangle_align: prefix

  command_case: canonical
  keyword_case: upper
  line_ending: unix

  # Sorting source and dependency lists can obscure deliberate ordering and create noisy diffs.
  enable_sort: false

markup:
  enable_markup: true
  first_comment_is_literal: false
  literal_comment_pattern: null
  fence_pattern: '^\s*#\s*([`~]{3}[`~]*)(.*)$'
  ruler_pattern: '^\s*#\s*[^\w\s]{3}.*[^\w\s]{3}$'
  bullet_char: '*'
  enum_char: '.'
  canonicalize_hashrulers: true
  emit_byteorder_mark: false
