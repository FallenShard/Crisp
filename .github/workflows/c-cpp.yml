name: Windows

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Locate MSVC
        id: msvc
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installationPath) {
            throw "Visual Studio with the MSVC x64 toolchain was not found."
          }
          "installation-path=$installationPath" >> $env:GITHUB_OUTPUT

      - name: Configure Release
        shell: cmd
        run: |
          call "${{ steps.msvc.outputs.installation-path }}\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1
          cmake --preset x64-release

      - name: Build Release
        shell: cmd
        run: |
          call "${{ steps.msvc.outputs.installation-path }}\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1
          cmake --build --preset x64-release-build

